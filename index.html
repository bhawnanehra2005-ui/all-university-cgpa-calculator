<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CGPA to Percentage Calculator - All Indian Universities</title>
<meta name="description" content="Free CGPA to Percentage Calculator for VTU, GTU, Mumbai University, AKTU, MDU, CBSE. Convert 10 point CGPA to %.">
<style>
body { font-family: 'Segoe UI', Arial; background-color: #0f172a; color: #fff; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
.banner { width: 100%; max-width: 700px; height: 90px; background-color: #1e293b; border: 1px dashed #475569; display: flex; justify-content: center; align-items: center; border-radius: 10px; margin-bottom: 20px; color: #94a3b8; }
.card { width: 100%; max-width: 500px; background: #1e293b; border-radius: 15px; padding: 25px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
h1 { color: #38bdf8; text-align: center; margin: 0; font-size: 26px; }
p.sub { text-align: center; color: #94a3b8; margin-top: 5px; }
label { display: block; margin-top: 15px; margin-bottom: 5px; color: #cbd5e1; }
select, input { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #334155; background: #0f172a; color: white; box-sizing: border-box; }
button { width: 100%; margin-top: 20px; padding: 13px; background: #38bdf8; color: #0f172a; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 16px; }
.result { margin-top: 20px; padding: 15px; background: #0f172a; border-radius: 8px; text-align: center; display: none; border: 1px solid #38bdf8; }
.result b { color: #38bdf8; font-size: 24px; }
.footer-links { margin-top:20px; text-align:center; font-size:13px; }
.footer-links a { color:#94a3b8; margin:0 10px; text-decoration:none; }
</style>
</head>
<body>
<div class="banner">AdSense Ad - Top Banner 728x90</div>
<div class="card">
<h1>CGPA to Percentage</h1>
<p class="sub">New Version - All University (2026)</p>
<label>Select Your University Formula:</label>
<select id="uni">
<option value="9.5">CBSE / AKTU / MDU / General (CGPA x 9.5)</option>
<option value="8.0">VTU Formula (CGPA - 0.5) x 10</option>
<option value="7.1">GTU / Mumbai (CGPA - 0.5) x 10</option>
</select>
<label>Enter Your CGPA (out of 10):</label>
<input type="number" id="cgpa" placeholder="e.g. 8.25" step="0.01">
<button onclick="calc()">Calculate Percentage</button>
<div id="res" class="result"></div>
<div class="footer-links">
<a href="about.html">About Us</a> | <a href="privacy.html">Privacy Policy</a> | <a href="contact.html">Contact</a>
</div>
</div>
<script>
function calc(){
let c=parseFloat(document.getElementById('cgpa').value);
let type=document.getElementById('uni').value;
if(!c){alert('Please Enter CGPA');return;}
let p=0;
if(type==9.5){ p=c*9.5; } else { p=(c-0.5)*10; }
if(p>100) p=100;
document.getElementById('res').style.display='block';
document.getElementById('res').innerHTML=`Your Percentage is<br><b>${p.toFixed(2)}%</b><br><small>Calculated Successfully</small>`;
}
</script>
</body>
</html>
